<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Content Security Policy: scripts come from this site and from the Grist plugin API only, and the
    page opens no network connection. Pictures may come from https addresses (attachment test).
    If you use another Grist server, change the host below AND in the script tag.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://grist.numerique.gouv.fr; img-src 'self' data: blob: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>export_tdb</title>
  <link rel="stylesheet" href="explorer.css?v=0.6.4">
  <link rel="stylesheet" href="board.css?v=0.6.4">
  <script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
</head>
<body>
  <main id="app">
    <h1><span data-i18n="title"></span> <small class="version" id="version">0.6.4</small></h1>
    <div id="tabs" role="tablist">
      <button type="button" role="tab" id="tabBoard" class="tab" aria-selected="true" data-i18n="tabBoard"></button>
      <button type="button" role="tab" id="tabExplorer" class="tab" aria-selected="false" data-i18n="tabExplorer"></button>
      <button type="button" role="tab" id="tabLab" class="tab" aria-selected="false" data-i18n="tabLab"></button>
    </div>
    <p id="status" role="status"></p>
    <p id="error" role="alert" hidden></p>

    <div id="panelBoard" role="tabpanel">
      <p id="boardNotice" class="warning" role="status" hidden></p>
      <div id="boardBar">
        <button type="button" id="boardEdit" class="button" data-i18n="boardEdit"></button>
        <button type="button" id="boardValuesButton" class="button secondary" aria-expanded="false" hidden data-i18n="boardValuesButton"></button>
        <span id="boardSaveState" class="hint" role="status"></span>
      </div>
      <div id="boardTools" hidden>
        <p id="boardHelp" class="hint" data-i18n="boardHelp"></p>
        <div class="tools">
          <div class="tool">
            <label for="boardAddType"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardAdd">?</span> <span data-i18n="boardAddType"></span></label>
            <select id="boardAddType"></select>
          </div>
          <button type="button" id="boardAdd" class="button" data-i18n="boardAdd"></button>
          <button type="button" id="boardRefresh" class="button secondary" data-i18n="boardRefresh"></button>
        </div>
        <div class="tools">
          <div class="tool">
            <label for="boardFormat"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardFormat">?</span> <span data-i18n="boardFormat"></span></label>
            <select id="boardFormat"></select>
          </div>
          <div class="tool">
            <label for="boardOrientation"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardOrientation">?</span> <span data-i18n="boardOrientation"></span></label>
            <select id="boardOrientation"></select>
          </div>
          <div class="tool">
            <label for="boardMargin"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardMargin">?</span> <span data-i18n="boardMargin"></span></label>
            <select id="boardMargin"></select>
          </div>
          <div class="tool">
            <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardZoom">?</span> <span data-i18n="boardZoom"></span></p>
            <div class="row">
              <button type="button" id="boardZoomOut" class="button secondary" data-i18n-label="boardZoomOut">&minus;</button>
              <button type="button" id="boardZoomFit" class="button secondary" data-i18n="boardZoomFit"></button>
              <button type="button" id="boardZoomIn" class="button secondary" data-i18n-label="boardZoomIn">+</button>
            </div>
          </div>
        </div>
        <div id="boardConfirm" class="warning" role="alertdialog" hidden>
          <p id="boardConfirmText"></p>
          <div class="row">
            <button type="button" id="boardConfirmYes" class="button danger" data-i18n="boardConfirmYes"></button>
            <button type="button" id="boardConfirmNo" class="button secondary" data-i18n="boardConfirmNo"></button>
          </div>
        </div>
      </div>
      <div id="boardLayout">
        <div id="boardScroll"><div id="boardCanvas"></div></div>
        <aside id="boardPanel" hidden>
          <h2 id="boardPanelHeading" data-i18n="boardPanelTitle"></h2>
          <div id="boardTitleRow">
          <label for="boardTitle"><span class="help" tabindex="0" role="img" data-i18n-tip="tipFieldTitle">?</span> <span data-i18n="boardFieldTitle"></span></label>
          <input type="text" id="boardTitle" maxlength="200">
          </div>
          <div id="boardTableSettings" hidden>
            <h3 data-i18n="boardTableTitle"></h3>
            <label for="boardKind"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardKind">?</span> <span data-i18n="boardKind"></span></label>
            <select id="boardKind"></select>
            <label for="boardTable"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardTable">?</span> <span data-i18n="boardTableLabel"></span></label>
            <select id="boardTable"></select>
            <div id="boardLinkRow" hidden>
              <label for="boardLink"><span class="help" id="boardRowsHelp" tabindex="0" role="img" data-i18n-tip="tipBoardRows">?</span> <span data-i18n="boardRows"></span></label>
              <select id="boardLink"></select>
              <label class="check"><input type="checkbox" id="boardMoreLinks"> <span data-i18n="boardMoreLinks"></span></label>
            </div>
            <label for="boardGroup1"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardItem">?</span> <span data-i18n="boardItem"></span></label>
            <select id="boardGroup1"></select>
            <div id="boardGroupRow" hidden>
              <label class="check"><input type="checkbox" id="boardMerge"> <span class="help" tabindex="0" role="img" data-i18n-tip="tipMerge">?</span> <span data-i18n="boardMerge"></span></label>
            </div>
            <div id="boardCrossBox" hidden>
              <label for="boardColItem"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardColItem">?</span> <span data-i18n="boardColItem"></span></label>
              <select id="boardColItem"></select>
              <div id="boardCrossMore" class="pair" hidden>
                <div>
                  <label for="boardSlice"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardSlice">?</span> <span data-i18n="boardSlice"></span></label>
                  <select id="boardSlice"></select>
                </div>
                <div>
                  <label for="boardColSort"><span data-i18n="boardColSort"></span></label>
                  <select id="boardColSort"></select>
                </div>
              </div>
            </div>
            <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardColumns">?</span> <span data-i18n="boardColumns"></span></p>
            <div id="boardColumnRows"></div>
            <button type="button" id="boardAddColumn" class="button secondary small" data-i18n="boardAddColumn"></button>
            <label class="check"><input type="checkbox" id="boardTotal"> <span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardTotal">?</span> <span data-i18n="boardTotalBelow"></span></label>
            <label class="check"><input type="checkbox" id="boardTotalRight"> <span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardTotalRight">?</span> <span data-i18n="boardTotalRight"></span></label>
            <div id="boardTotalRightRow" class="colTop" hidden>
              <select id="boardTotalRightFn" aria-label="Calcul du total à droite"></select>
              <button type="button" id="boardTotalRightLess" class="stepButton" data-i18n-label="boardDecLess">&larr;.0</button>
              <button type="button" id="boardTotalRightMore" class="stepButton" data-i18n-label="boardDecMore">.00&rarr;</button>
            </div>
            <details id="boardMore">
              <summary data-i18n="boardMore"></summary>
            <div class="section">
              <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipFilter">?</span> <span data-i18n="labFilters"></span></p>
              <button type="button" id="boardFilterToggle" class="toggle" aria-expanded="false">+</button>
            </div>
            <div id="boardFilterBody" hidden>
              <fieldset class="filter" id="boardFilter1"></fieldset>
              <fieldset class="filter" id="boardFilter2"></fieldset>
              <fieldset class="filter" id="boardFilter3"></fieldset>
            </div>
            <div class="section">
              <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipSort">?</span> <span data-i18n="labSort"></span></p>
              <button type="button" id="boardSortToggle" class="toggle" aria-expanded="false">+</button>
            </div>
            <div id="boardSortBody" hidden>
              <div class="pair">
                <div>
                  <label for="boardSortBy" data-i18n="boardSortWhat"></label>
                  <select id="boardSortBy"></select>
                </div>
                <div>
                  <label for="boardSortDir"><span data-i18n="boardSortDir"></span></label>
                  <select id="boardSortDir"></select>
                </div>
              </div>
              <select id="boardSortColumn" aria-label="Colonne de tri"></select>
              <div id="boardSortOrderBox" hidden>
                <p class="hint" data-i18n="sortOrderHint"></p>
                <ol id="boardSortOrder" class="orderList"></ol>
              </div>
            </div>
            </details>
            <p id="boardTableInfo" class="hint" role="status"></p>
          </div>
          <div id="boardExplain" class="explainWindow" role="dialog" hidden>
            <div class="explainHead" id="boardExplainHead">
              <strong data-i18n="boardLearnMore"></strong>
              <button type="button" id="boardExplainClose" class="explainClose" data-i18n-label="helpClose">&times;</button>
            </div>
            <div id="boardExplainBody" class="explain"></div>
          </div>
          <div id="boardValuesSettings" hidden>
            <p class="hint" data-i18n="boardValuesHelp"></p>
            <div id="boardValuesList"></div>
            <button type="button" id="boardValuesAdd" class="button secondary small" data-i18n="boardValuesAdd"></button>
          </div>
          <div id="boardIndicatorSettings" hidden>
            <h3 data-i18n="boardIndicatorTitle"></h3>
            <div id="boardIndicatorBody"></div>
          </div>
          <div id="boardRecordSettings" hidden>
            <h3 data-i18n="boardRecordTitle"></h3>
            <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipRecordItems">?</span> <span data-i18n="boardRecordItems"></span></p>
            <div id="boardRecordRows"></div>
            <button type="button" id="boardRecordAdd" class="button secondary small" data-i18n="boardRecordAdd"></button>
            <div class="pair">
              <div>
                <label for="boardRecordColumns"><span class="help" tabindex="0" role="img" data-i18n-tip="tipRecordColumns">?</span> <span data-i18n="boardRecordColumns"></span></label>
                <select id="boardRecordColumns"></select>
              </div>
              <div>
                <label for="boardRecordSize"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardSize">?</span> <span data-i18n="boardSize"></span></label>
                <select id="boardRecordSize"></select>
              </div>
            </div>
            <p id="boardRecordInfo" class="hint" role="status"></p>
          </div>
          <div id="boardTextSettings" hidden>
            <h3 data-i18n="boardTextTitle"></h3>
            <label for="boardSource"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardSource">?</span> <span data-i18n="boardSource"></span></label>
            <select id="boardSource"></select>
            <div id="boardColumnRow" hidden>
              <label for="boardColumn"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardColumn">?</span> <span data-i18n="boardColumn"></span></label>
              <select id="boardColumn"></select>
            </div>
            <label for="boardText"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardText">?</span> <span data-i18n="boardText"></span></label>
            <textarea id="boardText" rows="8" maxlength="20000" spellcheck="true"></textarea>
            <label for="boardField"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardField">?</span> <span data-i18n="boardField"></span></label>
            <select id="boardField"></select>
            <p class="hint" data-i18n="boardTextHelp"></p>
            <label for="boardSize"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardSize">?</span> <span data-i18n="boardSize"></span></label>
            <select id="boardSize"></select>
            <label for="boardAlign"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardAlign">?</span> <span data-i18n="boardAlign"></span></label>
            <select id="boardAlign"></select>
            <label for="boardFill"><span class="help" tabindex="0" role="img" data-i18n-tip="tipBoardFill">?</span> <span data-i18n="boardFill"></span></label>
            <select id="boardFill"></select>
            <p id="boardTextInfo" class="hint" role="status"></p>
            <p id="boardCellState" class="hint" role="status"></p>
          </div>
          <div class="row">
            <button type="button" id="boardDelete" class="button danger" data-i18n="boardDelete"></button>
            <button type="button" id="boardClose" class="button secondary" data-i18n="boardClose"></button>
          </div>
        </aside>
      </div>
    </div>

    <div id="panelExplorer" role="tabpanel" hidden>
    <p id="intro" data-i18n="intro"></p>

    <section id="summary" hidden>
      <p id="linked"></p>
      <p id="seen"></p>
      <p class="hint" data-i18n="moveHint"></p>
      <label class="check"><input type="checkbox" id="reveal"> <span data-i18n="revealLabel"></span></label>
      <button type="button" id="rerun" class="button" data-i18n="rerun"></button>
    </section>

    <section id="tests" hidden>
      <h2 data-i18n="testsTitle"></h2>
      <div class="row">
        <button type="button" id="attachmentTest" class="button" data-i18n="attachmentTest"></button>
      </div>
      <h3 data-i18n="writeTitle"></h3>
      <label for="writeColumn" data-i18n="writeColumn"></label>
      <select id="writeColumn"></select>
      <div class="row">
        <button type="button" id="writePrepare" class="button" data-i18n="writePrepare"></button>
      </div>
      <div id="writeConfirmBox" hidden>
        <p class="warning" data-i18n="writeWarning"></p>
        <div class="row">
          <button type="button" id="writeConfirm" class="button" data-i18n="writeConfirm"></button>
          <button type="button" id="writeCancel" class="button secondary" data-i18n="writeCancel"></button>
        </div>
      </div>
      <p id="writeProblem" role="alert" hidden></p>
      <ul id="testResults"></ul>
    </section>

    <section id="structure" hidden>
      <h2 data-i18n="colDescendants"></h2>
      <ul id="descendants"></ul>
      <h2 data-i18n="colTables"></h2>
      <ul id="tableList"></ul>
    </section>

    <section id="reportBox" hidden>
      <h2 data-i18n="reportTitle"></h2>
      <div class="row">
        <button type="button" id="copy" class="button" data-i18n="copy"></button>
        <span id="copyState" role="status"></span>
      </div>
      <textarea id="report" readonly rows="14" spellcheck="false"></textarea>
    </section>
    </div>

    <div id="panelLab" role="tabpanel" hidden>
      <p data-i18n="labIntro"></p>
      <p class="hint" data-i18n="labHelp"></p>
      <p id="labMessage" role="status"></p>
      <div id="labForm" hidden>
        <label for="labStart"><span class="help" tabindex="0" role="img" data-i18n-tip="tipStart">?</span> <span data-i18n="labStart"></span></label>
        <select id="labStart"></select>
        <p id="labStartInfo" class="hint" role="status"></p>
        <label for="labTable"><span class="help" tabindex="0" role="img" data-i18n-tip="tipTable">?</span> <span data-i18n="labTable"></span></label>
        <select id="labTable"></select>
        <label for="labPath"><span class="help" tabindex="0" role="img" data-i18n-tip="tipPath">?</span> <span data-i18n="labPath"></span></label>
        <select id="labPath"></select>
        <label for="labGroup"><span class="help" tabindex="0" role="img" data-i18n-tip="tipGroup">?</span> <span data-i18n="labGroupBy"></span></label>
        <select id="labGroup"></select>
        <label for="labGroup2"><span class="help" tabindex="0" role="img" data-i18n-tip="tipGroup2">?</span> <span data-i18n="labGroupBy2"></span></label>
        <select id="labGroup2"></select>
        <label class="check"><input type="checkbox" id="labMerge"> <span class="help" tabindex="0" role="img" data-i18n-tip="tipMerge">?</span> <span data-i18n="labMerge"></span></label>
        <label for="labFn"><span class="help" tabindex="0" role="img" data-i18n-tip="tipFn">?</span> <span data-i18n="labFunction"></span></label>
        <select id="labFn"></select>
        <p class="label"><span class="help" tabindex="0" role="img" data-i18n-tip="tipColumns">?</span> <span data-i18n="labColumn"></span></p>
        <div id="labColumns" class="columns"></div>
        <fieldset class="filter" id="labFilter1"></fieldset>
        <fieldset class="filter" id="labFilter2"></fieldset>
        <label for="labSort"><span class="help" tabindex="0" role="img" data-i18n-tip="tipSort">?</span> <span data-i18n="labSort"></span></label>
        <select id="labSort"></select>
        <label class="check"><input type="checkbox" id="labAuto" checked> <span class="help" tabindex="0" role="img" data-i18n-tip="tipAuto">?</span> <span data-i18n="labAuto"></span></label>
        <div class="row">
          <button type="button" id="labRun" class="button" data-i18n="labRun"></button>
          <button type="button" id="labRefresh" class="button secondary" data-i18n="labRefresh"></button>
        </div>
      </div>
      <p id="labInfo" class="hint"></p>
      <p id="labWarnings" class="warning" hidden></p>
      <div class="tableWrap"><table id="labResult"></table></div>
      <div class="row"><button type="button" id="labCopy" class="button" data-i18n="labCopy" hidden></button></div>
    </div>
  </main>

  <script src="shared/i18n.js?v=0.6.4"></script>
  <script src="schema.js?v=0.6.4"></script>
  <script src="shape.js?v=0.6.4"></script>
  <script src="report.js?v=0.6.4"></script>
  <script src="values.js?v=0.6.4"></script>
  <script src="dataset.js?v=0.6.4"></script>
  <script src="rowset.js?v=0.6.4"></script>
  <script src="aggregate.js?v=0.6.4"></script>
  <script src="format.js?v=0.6.4"></script>
  <script src="expr.js?v=0.6.4"></script>
  <script src="explorer.js?v=0.6.4"></script>
  <script src="help.js?v=0.6.4"></script>
  <script src="filter-ui.js?v=0.6.4"></script>
  <script src="lab.js?v=0.6.4"></script>
  <script src="layout.js?v=0.6.4"></script>
  <script src="flow.js?v=0.6.4"></script>
  <script src="model.js?v=0.6.4"></script>
  <script src="grist-access.js?v=0.6.4"></script>
  <script src="markdown.js?v=0.6.4"></script>
  <script src="fields.js?v=0.6.4"></script>
  <script src="record.js?v=0.6.4"></script>
  <script src="indicator.js?v=0.6.4"></script>
  <script src="data-cache.js?v=0.6.4"></script>
  <script src="markdown-view.js?v=0.6.4"></script>
  <script src="table-query.js?v=0.6.4"></script>
  <script src="named.js?v=0.6.4"></script>
  <script src="values-panel.js?v=0.6.4"></script>
  <script src="indicator-panel.js?v=0.6.4"></script>
  <script src="board.js?v=0.6.4"></script>
  <script src="tabs.js?v=0.6.4"></script>
</body>
</html>
