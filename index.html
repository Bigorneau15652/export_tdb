<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Content Security Policy: scripts come from this site and from the Grist plugin API only, and the
    page opens no network connection. Pictures may come from https addresses (attachment test).
    If you use another Grist server, change the host below AND in the script tag.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://grist.numerique.gouv.fr; img-src 'self' data: blob: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>export_tdb</title>
  <link rel="stylesheet" href="explorer.css?v=0.16.1">
  <link rel="stylesheet" href="board.css?v=0.16.1">
  <script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
</head>
<body>
  <main id="app">
    <h1 id="boardTitleLine"><span data-i18n="title"></span> <small class="version" id="version">0.16.1</small></h1>
    <p id="status" role="status"></p>
    <p id="error" role="alert" hidden></p>

    <div id="panelBoard">
      <p id="boardNotice" class="warning" role="status" hidden></p>
      <div id="boardBar">
        <button type="button" id="boardEdit" class="button" data-i18n="boardEdit"></button>
        <div id="boardTools" class="barGroup" hidden>
          <button type="button" id="boardAddMenu" class="iconButton primary" data-icon="plus" data-i18n-tip="barAdd" aria-haspopup="true" aria-expanded="false"></button>
          <button type="button" id="boardPaletteButton" class="iconButton" data-icon="palette" data-i18n-tip="barPalette" aria-haspopup="true" aria-expanded="false"></button>
          <button type="button" id="boardFormatButton" class="iconButton" data-icon="format" data-i18n-tip="barFormat" aria-haspopup="true" aria-expanded="false"></button>
          <button type="button" id="boardOrientation" class="iconButton" data-icon="landscape" data-i18n-tip="barOrientationLandscape"></button>
          <button type="button" id="boardMarginButton" class="iconButton" data-icon="margin" data-i18n-tip="barMargin" aria-haspopup="true" aria-expanded="false"></button>
          <button type="button" id="boardFooterButton" class="iconButton" data-icon="footer" data-i18n-tip="barFooter" aria-haspopup="true" aria-expanded="false"></button>
          <button type="button" id="boardNumbers" class="iconButton" data-icon="numbers" data-i18n-tip="barNumbers" aria-pressed="false"></button>
          <button type="button" id="boardRefresh" class="iconButton" data-icon="refresh" data-i18n-tip="barRefresh"></button>
        </div>
        <button type="button" id="boardPrint" class="iconButton" data-icon="print" data-i18n-tip="barPrint"></button>
        <span class="barSpacer"></span>
        <button type="button" id="boardValuesButton" class="iconButton glyph" aria-expanded="false" hidden data-i18n-tip="boardValuesButton">π</button>
        <button type="button" id="boardDebug" class="iconButton" data-icon="developer" data-i18n-tip="barDebug" hidden></button>
        <span id="boardSaveState" class="hint" role="status"></span>
      </div>
      <div id="boardMenu" class="barMenu" role="dialog" hidden>
        <div data-menu="types" class="menuList" hidden></div>
        <div data-menu="palette" class="menuList" hidden></div>
        <div data-menu="format" class="menuList" hidden></div>
        <div data-menu="margin" class="menuList" hidden></div>
        <div data-menu="footer" hidden>
          <label for="boardFooter" data-i18n="boardFooter"></label>
          <input type="text" id="boardFooter" maxlength="120">
        </div>
      </div>
      <div id="boardDebugBox" class="debugBox" hidden>
        <p class="label" data-i18n="debugTitle"></p>
        <textarea id="boardDebugText" readonly rows="10" spellcheck="false"></textarea>
        <button type="button" id="boardDebugClose" class="button secondary small" data-i18n="debugClose"></button>
      </div>
      <div id="boardZoomBar"><input type="range" id="boardZoom" min="0" max="5" step="1" value="2" data-i18n-tip="barZoom"></div>
      <div id="boardLayout">
        <div id="boardScroll"><div id="boardCanvas"></div></div>
        <aside id="boardPanel" hidden>
          <div id="boardPanelHead">
            <h2 id="boardPanelHeading" data-i18n-hover="boardValuesHelp" hidden></h2>
            <select id="boardType" data-i18n-label="boardBlockType"></select>
            <button type="button" id="boardGuide" class="iconButton small" data-icon="course" data-i18n-tip="barGuide" hidden></button>
            <button type="button" id="boardClose" class="iconButton small" data-i18n-label="boardClose">&times;</button>
          </div>
          <div id="boardTitleRow">
          <label for="boardTitle" data-i18n-hover="tipFieldTitle"><span data-i18n="boardFieldTitle"></span></label>
          <input type="text" id="boardTitle" maxlength="200">
          </div>
          <div id="boardTableSettings" hidden>
            <h3 id="boardTableHeading" data-i18n="boardTableTitle" class="sectionTitle"></h3>
            <label for="boardKind" data-i18n-hover="tipBoardKind"><span data-i18n="boardKind"></span></label>
            <select id="boardKind"></select>
            <label for="boardTable" data-i18n-hover="tipBoardTable"><span data-i18n="boardTableLabel"></span></label>
            <select id="boardTable"></select>
            <div id="boardLinkRow" hidden>
              <label for="boardLink"><span class="help" id="boardRowsHelp" tabindex="0" role="img" data-i18n-tip="tipBoardRows">?</span> <span data-i18n="boardRows"></span></label>
              <select id="boardLink"></select>
              <label class="check"><input type="checkbox" id="boardMoreLinks"> <span data-i18n="boardMoreLinks"></span></label>
            </div>
            <label for="boardGroup1" class="notScatter" data-i18n-hover="tipBoardItem"><span data-i18n="boardItem"></span></label>
            <select id="boardGroup1" class="notScatter"></select>
            <div id="boardGroupRow" hidden>
              <label class="check" data-i18n-hover="tipMerge"><input type="checkbox" id="boardMerge"> <span data-i18n="boardMerge"></span></label>
            </div>
            <div id="boardCrossBox" hidden>
              <label for="boardColItem" data-i18n-hover="tipBoardColItem"><span data-i18n="boardColItem"></span></label>
              <select id="boardColItem"></select>
              <div id="boardCrossMore" class="pair" hidden>
                <div class="tableOnly">
                  <label for="boardSlice" data-i18n-hover="tipBoardSlice"><span data-i18n="boardSlice"></span></label>
                  <select id="boardSlice"></select>
                </div>
                <div>
                  <label for="boardColSort"><span data-i18n="boardColSort"></span></label>
                  <select id="boardColSort"></select>
                </div>
              </div>
            </div>
            <p class="label" data-i18n-hover="tipBoardColumns"><span id="boardColumnsLabel" data-i18n="boardColumns"></span></p>
            <div id="boardColumnRows"></div>
            <button type="button" id="boardAddColumn" class="button secondary small" data-i18n="boardAddColumn"></button>
            <label class="check tableOnly" data-i18n-hover="tipBoardTotal"><input type="checkbox" id="boardTotal"> <span data-i18n="boardTotalBelow"></span></label>
            <div id="boardTotalLabelRow" class="tableOnly" hidden>
              <label for="boardTotalLabel" data-i18n-hover="tipBoardTotalLabel"><span data-i18n="boardTotalLabel"></span></label>
              <input type="text" id="boardTotalLabel" maxlength="60">
            </div>
            <label class="check tableOnly" data-i18n-hover="tipBoardTotalRight"><input type="checkbox" id="boardTotalRight"> <span data-i18n="boardTotalRight"></span></label>
            <div id="boardTotalRightRow" class="colTop tableOnly" hidden>
              <select id="boardTotalRightFn" aria-label="Calcul du total à droite"></select>
              <button type="button" id="boardTotalRightLess" class="stepButton" data-i18n-label="boardDecLess">&larr;.0</button>
              <button type="button" id="boardTotalRightMore" class="stepButton" data-i18n-label="boardDecMore">.00&rarr;</button>
            </div>
            <details id="boardMore">
              <summary data-i18n="boardMore"></summary>
            <div class="section">
              <p class="label" data-i18n-hover="tipFilter"><span data-i18n="labFilters"></span></p>
              <button type="button" id="boardFilterToggle" class="toggle" aria-expanded="false">+</button>
            </div>
            <div id="boardFilterBody" hidden>
              <fieldset class="filter" id="boardFilter1"></fieldset>
              <fieldset class="filter" id="boardFilter2"></fieldset>
              <fieldset class="filter" id="boardFilter3"></fieldset>
            </div>
            <div class="section">
              <p class="label" data-i18n-hover="tipSort"><span data-i18n="labSort"></span></p>
              <button type="button" id="boardSortToggle" class="toggle" aria-expanded="false">+</button>
            </div>
            <div id="boardSortBody" hidden>
              <div class="pair">
                <div>
                  <label for="boardSortBy" data-i18n="boardSortWhat"></label>
                  <select id="boardSortBy"></select>
                </div>
                <div>
                  <label for="boardSortDir"><span data-i18n="boardSortDir"></span></label>
                  <select id="boardSortDir"></select>
                </div>
              </div>
              <select id="boardSortColumn" aria-label="Colonne de tri"></select>
              <div id="boardSortOrderBox" data-i18n-hover="sortOrderHint" hidden>
                <ol id="boardSortOrder" class="orderList"></ol>
              </div>
            </div>
            </details>
            <p id="boardTableInfo" class="hint" role="status"></p>
          </div>
          <div id="boardExplain" class="explainWindow" role="dialog" hidden>
            <div class="explainHead" id="boardExplainHead">
              <strong data-i18n="boardLearnMore"></strong>
              <button type="button" id="boardExplainClose" class="explainClose" data-i18n-label="helpClose">&times;</button>
            </div>
            <div id="boardExplainBody" class="explain"></div>
          </div>
          <div id="boardValuesSettings" hidden>
            <div id="boardValuesList"></div>
            <button type="button" id="boardValuesAdd" class="button secondary small" data-i18n="boardValuesAdd"></button>
          </div>
          <div id="boardChartSettings" hidden>
            <h3 data-i18n="boardChartTitle" class="sectionTitle"></h3>
            <label for="boardChartType" data-i18n-hover="tipChartType"><span data-i18n="boardChartType"></span></label>
            <select id="boardChartType"></select>
            <label for="boardChartLegend"><span data-i18n="boardChartLegend"></span></label>
            <select id="boardChartLegend"></select>
            <label for="boardChartLabels" data-i18n-hover="tipChartLabels"><span data-i18n="boardChartLabels"></span></label>
            <select id="boardChartLabels"></select>
            <p id="boardChartInfo" class="hint" role="status"></p>
          </div>
          <div id="boardIndicatorSettings" hidden>
            <div id="boardIndicatorBody"></div>
          </div>
          <div id="boardImageSettings" hidden>
            <label for="boardImageColumn" data-i18n-hover="tipImageColumn"><span data-i18n="boardImageColumn"></span></label>
            <select id="boardImageColumn"></select>
            <label for="boardImageRank" data-i18n-hover="tipImageRank"><span data-i18n="boardImageRank"></span></label>
            <input type="number" id="boardImageRank" min="1" max="20" step="1" inputmode="numeric">
            <label for="boardImageCaption" data-i18n-hover="tipImageCaption"><span data-i18n="boardImageCaption"></span></label>
            <select id="boardImageCaption"></select>
            <p id="boardImageInfo" class="hint" role="status"></p>
          </div>
          <div id="boardRecordSettings" hidden>
            <p class="label" data-i18n-hover="tipRecordItems"><span data-i18n="boardRecordItems"></span></p>
            <div id="boardRecordRows"></div>
            <button type="button" id="boardRecordAdd" class="button secondary small" data-i18n="boardRecordAdd"></button>
            <label for="boardRecordSize" data-i18n-hover="tipBoardSize"><span data-i18n="boardSize"></span></label>
            <select id="boardRecordSize"></select>
            <p id="boardRecordInfo" class="hint" role="status"></p>
          </div>
          <div id="boardTextSettings" hidden>
            <label for="boardSource" data-i18n-hover="tipBoardSource"><span data-i18n="boardSource"></span></label>
            <select id="boardSource"></select>
            <div id="boardColumnRow" hidden>
              <label for="boardColumn" data-i18n-hover="tipBoardColumn"><span data-i18n="boardColumn"></span></label>
              <select id="boardColumn"></select>
            </div>
            <label for="boardText" data-i18n-hover="tipBoardText"><span data-i18n="boardText"></span></label>
            <textarea id="boardText" rows="8" maxlength="20000" spellcheck="true"></textarea>
            <label for="boardField" data-i18n-hover="tipBoardField"><span data-i18n="boardField"></span></label>
            <select id="boardField"></select>
            <label for="boardSize" data-i18n-hover="tipBoardSize"><span data-i18n="boardSize"></span></label>
            <select id="boardSize"></select>
            <label for="boardAlign" data-i18n-hover="tipBoardAlign"><span data-i18n="boardAlign"></span></label>
            <select id="boardAlign"></select>
            <label for="boardFill" data-i18n-hover="tipBoardFill"><span data-i18n="boardFill"></span></label>
            <select id="boardFill"></select>
            <p id="boardTextInfo" class="hint" role="status"></p>
            <p id="boardCellState" class="hint" role="status"></p>
          </div>
          <div class="row">
            <button type="button" id="boardDelete" class="button danger small" data-i18n="boardDelete"></button>
          </div>
        </aside>
      </div>
    </div>

  </main>

  <script src="shared/i18n.js?v=0.16.1"></script>
  <script src="schema.js?v=0.16.1"></script>
  <script src="shape.js?v=0.16.1"></script>
  <script src="report.js?v=0.16.1"></script>
  <script src="values.js?v=0.16.1"></script>
  <script src="dataset.js?v=0.16.1"></script>
  <script src="rowset.js?v=0.16.1"></script>
  <script src="aggregate.js?v=0.16.1"></script>
  <script src="format.js?v=0.16.1"></script>
  <script src="expr.js?v=0.16.1"></script>
  <script src="explorer.js?v=0.16.1"></script>
  <script src="help.js?v=0.16.1"></script>
  <script src="filter-ui.js?v=0.16.1"></script>
  <script src="layout.js?v=0.16.1"></script>
  <script src="flow.js?v=0.16.1"></script>
  <script src="model.js?v=0.16.1"></script>
  <script src="grist-access.js?v=0.16.1"></script>
  <script src="markdown.js?v=0.16.1"></script>
  <script src="fields.js?v=0.16.1"></script>
  <script src="record.js?v=0.16.1"></script>
  <script src="image.js?v=0.16.1"></script>
  <script src="indicator.js?v=0.16.1"></script>
  <script src="vendor/echarts/echarts.custom.min.js?v=0.16.1"></script>
  <script src="chart-option.js?v=0.16.1"></script>
  <script src="data-cache.js?v=0.16.1"></script>
  <script src="markdown-view.js?v=0.16.1"></script>
  <script src="table-query.js?v=0.16.1"></script>
  <script src="named.js?v=0.16.1"></script>
  <script src="values-panel.js?v=0.16.1"></script>
  <script src="indicator-panel.js?v=0.16.1"></script>
  <script src="guide-content.js?v=0.16.1"></script>
  <script src="guide.js?v=0.16.1"></script>
  <script src="icons.js?v=0.16.1"></script>
  <script src="board.js?v=0.16.1"></script>
</body>
</html>
